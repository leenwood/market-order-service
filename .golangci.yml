linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - goimports
    - misspell
    - revive

linters-settings:
  goimports:
    local-prefixes: market-order-service

issues:
  exclude-rules:
    - path: "_test.go"
      linters:
        - errcheck
