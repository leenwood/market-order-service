basePath: /
definitions:
  dto.CreateOrderRequest:
    properties:
      delivery_address:
        $ref: '#/definitions/dto.DeliveryAddressDTO'
      payment_method:
        enum:
        - card
        - cash
        type: string
    required:
    - delivery_address
    - payment_method
    type: object
  dto.DeliveryAddressDTO:
    properties:
      city:
        type: string
      street:
        type: string
      zip:
        type: string
    required:
    - city
    - street
    - zip
    type: object
  dto.ListOrdersResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.OrderResponse'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  dto.OrderItemResponse:
    properties:
      name:
        type: string
      price:
        type: number
      product_id:
        type: string
      quantity:
        type: integer
      subtotal:
        type: number
    type: object
  dto.OrderResponse:
    properties:
      created_at:
        type: string
      delivery_address:
        $ref: '#/definitions/dto.DeliveryAddressDTO'
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/dto.OrderItemResponse'
        type: array
      payment_method:
        type: string
      status:
        type: string
      total_amount:
        type: number
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  dto.UpdateStatusRequest:
    properties:
      status:
        type: string
    required:
    - status
    type: object
host: localhost:8082
info:
  contact: {}
  description: Handles order creation, listing, status updates and cancellation.
  title: Market Order Service API
  version: "1.0"
paths:
  /api/v1/orders:
    get:
      parameters:
      - description: User UUID
        in: header
        name: X-User-ID
        required: true
        type: string
      - description: Filter by status
        in: query
        name: status
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ListOrdersResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List orders for a user
      tags:
      - orders
    post:
      consumes:
      - application/json
      parameters:
      - description: User UUID
        in: header
        name: X-User-ID
        required: true
        type: string
      - description: Order request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateOrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.OrderResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new order
      tags:
      - orders
  /api/v1/orders/{id}:
    get:
      parameters:
      - description: User UUID
        in: header
        name: X-User-ID
        required: true
        type: string
      - description: Order UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.OrderResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get order by ID
      tags:
      - orders
  /api/v1/orders/{id}/cancel:
    post:
      parameters:
      - description: User UUID
        in: header
        name: X-User-ID
        required: true
        type: string
      - description: User role (buyer|seller|admin)
        in: header
        name: X-User-Role
        required: true
        type: string
      - description: Order UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.OrderResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Cancel an order
      tags:
      - orders
  /api/v1/orders/{id}/status:
    patch:
      consumes:
      - application/json
      parameters:
      - description: User UUID
        in: header
        name: X-User-ID
        required: true
        type: string
      - description: User role (seller|admin)
        in: header
        name: X-User-Role
        required: true
        type: string
      - description: Order UUID
        in: path
        name: id
        required: true
        type: string
      - description: New status
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.OrderResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update order status
      tags:
      - orders
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Liveness probe
      tags:
      - health
  /ready:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Readiness probe
      tags:
      - health
schemes:
- http
swagger: "2.0"
tags:
- description: Order management endpoints
  name: orders
- description: Health and readiness probes
  name: health
